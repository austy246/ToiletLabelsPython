<script>
// Mobile-friendly file upload handling.
//
// 1) Fix for Chrome's ERR_UPLOAD_FILE_CHANGED: when a photo is captured
//    straight from the camera, the OS may still be writing the file when the
//    form is submitted; Chrome then detects the file changed on disk and
//    aborts. As soon as a file is picked we read it fully into memory and
//    replace the input with an in-memory copy, so submission no longer depends
//    on the on-disk file.
// 2) While that read is in progress the submit button is disabled, so the user
//    cannot submit before the file is safely buffered.
(function () {
    function snapshot(input) {
        if (!input.files || input.files.length === 0) return Promise.resolve();
        if (typeof DataTransfer === 'undefined' || !input.files[0].arrayBuffer) {
            return Promise.resolve();
        }
        var originals = Array.prototype.slice.call(input.files);
        return Promise.all(originals.map(function (file) {
            return file.arrayBuffer().then(function (buf) {
                return new File([buf], file.name, {
                    type: file.type,
                    lastModified: file.lastModified,
                });
            });
        })).then(function (copies) {
            var dt = new DataTransfer();
            copies.forEach(function (f) { dt.items.add(f); });
            input.files = dt.files;
        }).catch(function () {
            // Keep the original selection if anything goes wrong.
        });
    }

    document.querySelectorAll('form').forEach(function (form) {
        var fileInputs = form.querySelectorAll('input[type="file"]');
        if (!fileInputs.length) return;
        var submitBtns = form.querySelectorAll('[type="submit"]');
        var pending = 0;

        function setBusy(busy) {
            submitBtns.forEach(function (b) {
                b.disabled = busy;
                b.classList.toggle('opacity-50', busy);
                b.classList.toggle('cursor-not-allowed', busy);
            });
        }

        fileInputs.forEach(function (input) {
            input.addEventListener('change', function () {
                pending++;
                setBusy(true);
                snapshot(input).then(function () {
                    pending--;
                    if (pending <= 0) { pending = 0; setBusy(false); }
                });
            });
        });
    });
})();
</script>
