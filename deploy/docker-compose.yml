x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE missing}
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    mem_limit: 512m
    cpus: 1
    # Neprioritní projekt na sdíleném VPS: nižší váha CPU a přednostní oběť při OOM, aby nezdržel Věci Obecní.
    cpu_shares: 256
    oom_score_adj: 500
    healthcheck:
      test: ["CMD", "dotnet", "ToiletLabels.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s   # during start_period probe every 2 s so --wait returns quickly
      retries: 3
    networks:
      default: {}
      web:
        aliases: [toiletlabels-app]   # unique name: the shared Caddy resolves it (docs/migrace-vps.md)

networks:
  web:
    external: true
    name: web
